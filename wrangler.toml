# Cloudflare Workers 域名监控系统
# wrangler.toml 部署配置

name = "yuming"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# KV 命名空间绑定（已绑定现有 KV，数据不会丢失）
[[kv_namespaces]]
binding = "DOMAIN_MONITOR"
id = "a0aa08405b4849859042f93c7e7e181e"

# 定时触发器：每天 UTC 0:00（北京时间 8:00）自动检查域名到期
[triggers]
crons = ["0 0 * * *"]

# 注意：环境变量（TOKEN、TG_TOKEN、TG_ID、SITE_NAME、BACKGROUND_URL 等）
# 请在 Cloudflare 控制台设置，不要写在这里，否则 deploy 会覆盖控制台的值
